<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>מערכת נוכחות</title>

    <style>
        body {
            font-family: Arial;
            direction: rtl;
            background: #f5f5f5;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
        }

        input, button, select {
            padding: 8px;
            margin: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #eee;
        }
    </style>
</head>

<body>

<h1>מערכת נוכחות בענן</h1>

<!-- LOGIN -->
<div class="box">
    <h2>התחברות</h2>

    <input id="user" placeholder="שם משתמש">
    <input id="pass" type="password" placeholder="סיסמה">

    <button onclick="login()">כניסה</button>
</div>

<!-- ADD EMPLOYEE -->
<div class="box">
    <h2>הוספת עובד</h2>

    <input id="name" placeholder="שם">
    <input id="salary" placeholder="שכר">

    <select id="type">
        <option value="יומי">יומי</option>
        <option value="שעתי">שעתי</option>
    </select>

    <button onclick="addEmployee()">הוסף</button>
</div>

<!-- EMPLOYEES -->
<div class="box">
    <h2>עובדים</h2>

    <button onclick="loadEmployees()">רענן</button>

    <table>
        <thead>
        <tr>
            <th>שם</th>
            <th>שכר</th>
            <th>סוג</th>
            <th>פעולות</th>
        </tr>
        </thead>

        <tbody id="list"></tbody>
    </table>
</div>

<!-- SALARY -->
<div class="box">
    <h2>דוח שכר</h2>

    <button onclick="loadSalary()">טען דוח</button>

    <table>
        <thead>
        <tr>
            <th>שם</th>
            <th>שעות</th>
            <th>ימים</th>
            <th>שכר</th>
        </tr>
        </thead>

        <tbody id="salaryTable"></tbody>
    </table>
</div>

<!-- DASHBOARD -->
<div class="box">
    <h2>דשבורד</h2>

    <button onclick="loadDashboard()">רענן</button>

    <div id="dash"></div>
</div>

<script>

let currentUserRole = "";
let currentUserName = "";

async function login() {

    const res = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            username: document.getElementById("user").value,
            password: document.getElementById("pass").value
        })
    });

    const data = await res.json();

    if (data.status === "ok") {
        currentUserRole = data.role;
        currentUserName = document.getElementById("user").value;
        alert("התחברת כ: " + currentUserRole);
    } else {
        alert("שגיאה");
    }
}

function onlyAdmin() {
    if (currentUserRole !== "admin") {
        alert("רק מנהל");
        return false;
    }
    return true;
}

async function addEmployee() {

    if (!onlyAdmin()) return;

    await fetch("/add_employee", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: document.getElementById("name").value,
            salary: document.getElementById("salary").value,
            salary_type: document.getElementById("type").value
        })
    });

    loadEmployees();
}

async function loadEmployees() {

    const res = await fetch("/employees");
    const data = await res.json();

    let html = "";

    data.forEach(e => {
        html += `
        <tr>
            <td>${e[1]}</td>
            <td>${e[2]}</td>
            <td>${e[3]}</td>
            <td>
                <button onclick="clockIn('${e[1]}')">כניסה</button>
                <button onclick="clockOut('${e[1]}')">יציאה</button>
            </td>
        </tr>
        `;
    });

    document.getElementById("list").innerHTML = html;
}

async function clockIn(name) {
    await fetch("/clock_in", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name})
    });
}

async function clockOut(name) {
    await fetch("/clock_out", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name})
    });
}

async function loadSalary() {

    const res = await fetch("/salary_all");
    const data = await res.json();

    let html = "";

    data.forEach(e => {
        html += `
        <tr>
            <td>${e.name}</td>
            <td>${e.hours}</td>
            <td>${e.days}</td>
            <td>₪${e.salary}</td>
        </tr>
        `;
    });

    document.getElementById("salaryTable").innerHTML = html;
}

async function loadDashboard() {

    const res = await fetch("/dashboard");
    const data = await res.json();

    document.getElementById("dash").innerHTML =
        "עובדים פעילים: " + data.active +
        "<br>סה״כ עובדים: " + data.total_employees;
}

loadEmployees();

</script>

</body>
</html>
