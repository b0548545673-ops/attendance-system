<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>מערכת נוכחות</title>
    <style>
        body { font-family: Arial; direction: rtl; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background: #f0f0f0; }
        button { margin: 3px; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

<h1>מערכת נוכחות בענן</h1>

<input id="name" placeholder="שם עובד">
<input id="salary" placeholder="שכר">
<select id="type">
    <option>יומי</option>
    <option>שעתי</option>
</select>

<button onclick="addEmployee()">הוסף עובד</button>
<button onclick="loadEmployees()">רענן טבלה</button>

<table>
    <thead>
        <tr>
            <th>שם</th>
            <th>שכר</th>
            <th>סוג</th>
            <th>פעולות</th>
        </tr>
    </thead>
    <tbody id="list"></tbody>
</table>

<script>
async function addEmployee() {
    await fetch("/add_employee", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: document.getElementById("name").value,
            salary: document.getElementById("salary").value,
            salary_type: document.getElementById("type").value
        })
    });

    loadEmployees();
}

async function loadEmployees() {
    const res = await fetch("/employees");
    const data = await res.json();

    let html = "";

    data.forEach(e => {
        html += `
        <tr>
            <td>${e[1]}</td>
            <td>${e[2]}</td>
            <td>${e[3]}</td>
            <td>
                <button onclick="clockIn('${e[1]}')">כניסה</button>
                <button onclick="clockOut('${e[1]}')">יציאה</button>
            </td>
        </tr>`;
    });

    document.getElementById("list").innerHTML = html;
}

async function clockIn(name) {
    await fetch("/clock_in", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name})
    });
}

async function clockOut(name) {
    await fetch("/clock_out", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name})
    });
}

loadEmployees();
</script>

</body>
</html>
