<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>מערכת נוכחות</title>

    <style>
        body {
            font-family: Arial;
            direction: rtl;
            padding: 20px;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        input, button, select {
            padding: 8px;
            margin: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #eee;
        }
    </style>
</head>

<body>

<h1>מערכת נוכחות בענן</h1>

<!-- ================= LOGIN ================= -->
<div class="box">
    <h2>התחברות</h2>

    <input id="user" placeholder="שם משתמש">
    <input id="pass" type="password" placeholder="סיסמה">

    <button onclick="login()">כניסה</button>
</div>

<!-- ================= ADD EMPLOYEE ================= -->
<div class="box">
    <h2>הוספת עובד</h2>

    <input id="name" placeholder="שם עובד">
    <input id="salary" placeholder="שכר">

    <select id="type">
        <option value="יומי">יומי</option>
        <option value="שעתי">שעתי</option>
    </select>

    <button onclick="addEmployee()">הוסף</button>
</div>

<!-- ================= EMPLOYEES TABLE ================= -->
<div class="box">
    <h2>עובדים</h2>

    <button onclick="loadEmployees()">רענן טבלה</button>

    <table>
        <thead>
        <tr>
            <th>שם</th>
            <th>שכר</th>
            <th>סוג</th>
            <th>פעולות</th>
        </tr>
        </thead>

        <tbody id="list"></tbody>
    </table>
</div>

<script>

async function login() {
    const res = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            username: document.getElementById("user").value,
            password: document.getElementById("pass").value
        })
    });

    const data = await res.json();

    if (data.status === "ok") {
        alert("התחברת בהצלחה");
    } else {
        alert("שם משתמש או סיסמה שגויים");
    }
}

async function addEmployee() {
    await fetch("/add_employee", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: document.getElementById("name").value,
            salary: document.getElementById("salary").value,
            salary_type: document.getElementById("type").value
        })
    });

    loadEmployees();
}

async function loadEmployees() {
    const res = await fetch("/employees");
    const data = await res.json();

    let html = "";

    data.forEach(e => {
        html += `
        <tr>
            <td>${e[1]}</td>
            <td>${e[2]}</td>
            <td>${e[3]}</td>
            <td>
                <button onclick="clockIn('${e[1]}')">כניסה</button>
                <button onclick="clockOut('${e[1]}')">יציאה</button>
            </td>
        </tr>
        `;
    });

    document.getElementById("list").innerHTML = html;
}

async function clockIn(name) {
    await fetch("/clock_in", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name})
    });
}

async function clockOut(name) {
    await fetch("/clock_out", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name})
    });
}

loadEmployees();

</script>

</body>
</html>
