<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>מערכת עובדים</title>

<style>
body{font-family:Arial;background:#f4f6f9;direction:rtl}
.card{background:white;margin:10px;padding:15px;border-radius:10px}
button{padding:6px;margin:3px}
input,select{padding:6px}
table{width:100%;background:white}
td,th{padding:8px;border:1px solid #ddd}
</style>
</head>

<body>

<div class="card">
<h3>התחברות</h3>
<input id="u"><input id="p" type="password">
<button onclick="login()">כניסה</button>
</div>

<div class="card">
<h3>דשבורד</h3>
<button onclick="dash()">רענן</button>
<div id="dash"></div>
</div>

<div class="card">
<h3>הוספת עובד</h3>
<input id="name"><input id="salary">
<select id="type"><option>יומי</option><option>שעתי</option></select>
<button onclick="add()">הוסף</button>
</div>

<div class="card">
<h3>עובדים</h3>
<button onclick="load()">טען</button>
<table id="t"></table>
</div>

<div class="card">
<button onclick="salary()">דוח שכר</button>
<button onclick="pdf()">PDF</button>
<div id="s"></div>
</div>

<script>

async function login(){
await fetch("/login",{method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({user:u.value,pass:p.value})});
alert("מחובר");
}

async function dash(){
let r=await fetch("/dashboard");
dash.innerHTML=JSON.stringify(await r.json());
}

async function add(){
await fetch("/add",{method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({name:name.value,salary:salary.value,type:type.value})});
}

async function load(){
let r=await fetch("/employees");
let d=await r.json();

t.innerHTML=d.map(x=>`
<tr>
<td>${x[1]}</td>
<td>${x[2]}</td>
<td>${x[3]}</td>
<td>
<button onclick="fetch('/in',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'${x[1]}')})">כניסה</button>
<button onclick="fetch('/out',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'${x[1]}')})">יציאה</button>
</td>
</tr>
`).join("");
}

async function salary(){
let r=await fetch("/salary");
let d=await r.json();
s.innerHTML=JSON.stringify(d);
}

function pdf(){
window.location="/pdf";
}

</script>

</body>
</html>
