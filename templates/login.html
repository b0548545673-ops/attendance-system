<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>התחברות</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh
}

.box{
background:#1e293b;
padding:25px;
border-radius:12px;
width:300px
}

input,button{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:none
}

button{
background:#22c55e;
color:white;
cursor:pointer
}

#error{
color:#f87171;
margin-top:10px;
}
</style>
</head>

<body>

<div class="box">
<h2>מערכת נוכחות</h2>

<input id="user" placeholder="שם משתמש">
<input id="pass" type="password" placeholder="סיסמה">

<button onclick="login()">כניסה</button>

<p id="error"></p>
</div>

<script>

async function login(){

try{
let r = await fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
user: document.getElementById("user").value,
pass: document.getElementById("pass").value
})
});

let d = await r.json();

if(d.ok){
if(d.role === "admin"){
location.href = "/admin";
}else{
location.href = "/dashboard";
}
}else{
document.getElementById("error").innerText = "שם משתמש או סיסמה שגויים";
}

}catch(e){
document.getElementById("error").innerText = "שגיאת שרת - נסה שוב";
}

}

</script>

</body>
</html>
