<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>ניהול מערכת</title>

<style>
body{font-family:Arial;background:#111827;color:white}
.card{background:#1f2937;margin:10px;padding:15px;border-radius:10px}
input,select,button{padding:8px;margin:5px}
table{width:100%;background:white;color:black;border-collapse:collapse}
td,th{border:1px solid #ccc;padding:8px}
button{cursor:pointer}
</style>
</head>

<body>

<div class="card">
<h2>ניהול עובדים</h2>

<input id="name" placeholder="שם">
<input id="salary" placeholder="שכר">
<select id="type">
<option>יומי</option>
<option>שעתי</option>
</select>

<button onclick="add()">הוסף</button>
<button onclick="load()">רענן</button>
<button onclick="salary()">דוח שכר</button>
<button onclick="pdf()">PDF</button>
</div>

<div class="card">
<table id="t"></table>
</div>

<div class="card">
<h3>דוח שכר</h3>
<pre id="s"></pre>
</div>

<script>

async function add(){
await fetch("/add",{method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:name.value,
salary:salary.value,
type:type.value
})});

load();
}

async function load(){
let r = await fetch("/employees");
let d = await r.json();

t.innerHTML = `
<tr>
<th>שם</th>
<th>שכר</th>
<th>סוג</th>
<th>מחיקה</th>
</tr>
` + d.map(x=>`
<tr>
<td>${x.name}</td>
<td>${x.salary}</td>
<td>${x.type}</td>
<td><button onclick="del('${x.name}')">מחק</button></td>
</tr>
`).join("");
}

async function del(name){
await fetch("/delete",{method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({name})});
load();
}

async function salary(){
let r = await fetch("/salary");
let d = await r.json();
s.innerText = JSON.stringify(d,null,2);
}

function pdf(){
window.location="/pdf";
}

load();
</script>

</body>
</html>
